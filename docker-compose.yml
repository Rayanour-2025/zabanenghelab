services:
  nuxt_app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: zaban-enghelab-nuxt
    restart: unless-stopped
    env_file:
      - .env
    environment:
      NODE_ENV: "production"
      NITRO_HOST: "${NITRO_HOST:-0.0.0.0}"
      NITRO_PORT: "${NITRO_PORT:-3000}"
      AUTH_SECRET_KEY: "${AUTH_SECRET_KEY}"
    ports:
      - "${APP_PORT:-3015}:${NITRO_PORT:-3000}"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:' + (process.env.NITRO_PORT || 3000)).then(()=>process.exit(0)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 5
