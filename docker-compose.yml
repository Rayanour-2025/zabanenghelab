services:
  nuxt_app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: zaban-enghelab-nuxt
    restart: unless-stopped
    environment:
      NODE_ENV: "production"
      NITRO_HOST: "0.0.0.0"
      NITRO_PORT: "3000"
      AUTH_SECRET_KEY: "${AUTH_SECRET_KEY}"
    ports:
      - "3015:3000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000').then(()=>process.exit(0)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 5
